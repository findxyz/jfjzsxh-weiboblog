[project]
name = "weiboblog"
version = "0.1.0"
description = "微博博主微博抓取器"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
playwright = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weibo_blog"]
